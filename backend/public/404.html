  <title>404 ページが見つかりません</title>

    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f6f8; color: #1f2937; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }

<body>
  <main>
    <p class="code">404</p>
